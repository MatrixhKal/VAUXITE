name: Build U-Boot Motorola Rhode (SM6225)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      DEFCONFIG: qcom_defconfig
      ARCH: arm
      CROSS_COMPILE: aarch64-linux-gnu-

    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libncurses-dev \
            swig \
            python3-dev \
            python3-setuptools \
            python3-pyelftools \
            device-tree-compiler \
            gcc-aarch64-linux-gnu \
            libgnutls28-dev \
            uuid-dev
      
      - name: Fetch official AOSP mkbootimg script
        run: |
          curl -sSL "https://android.googlesource.com/platform/system/tools/mkbootimg/+/refs/heads/main/mkbootimg.py?format=TEXT" | base64 --decode > /usr/local/bin/mkbootimg
          chmod +x /usr/local/bin/mkbootimg

      - name: Clone U-Boot repository
        run: |
          git clone --depth 1 -b sm6225 https://gitlab.com/sm6225-schizophrenics/rhode-mainline/u-boot-motorola-rhode.git u-boot

      - name: Configure U-Boot
        run: |
          cd u-boot
          make ARCH=${{ env.ARCH }} CROSS_COMPILE=${{ env.CROSS_COMPILE }} ${{ env.DEFCONFIG }}

      - name: Build U-Boot
        run: |
          cd u-boot
          make ARCH=${{ env.ARCH }} CROSS_COMPILE=${{ env.CROSS_COMPILE }} -j$(nproc)

      - name: Pack U-Boot into Boot Image
        run: |
          cd u-boot
          
          INITFS_FILE="initramfs-empty.gz"
          UBOOT="u-boot-nodtb.bin"
          
          if [ ! -f "${UBOOT}" ]; then
            cp u-boot.bin ${UBOOT}
          fi

          gzip -c -9 ${UBOOT} > ${UBOOT}.gz

          echo 1 > 1
          gzip -c -9 1 > ${INITFS_FILE}
          rm -f 1

          mkdir -p ../output

          mkbootimg \
            --header_version 3 \
            --kernel ${UBOOT}.gz \
            --ramdisk ${INITFS_FILE} \
            --os_version "15.0.0" \
            --os_patch_level "2025-10" \
            -o ../output/boot-uboot-sm6225.img

          cp u-boot.bin ../output/u-boot.bin || true
          cp .config ../output/u-boot.config || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: u-boot-rhode-${{ github.run_number }}
          name: U-Boot Motorola Rhode - Build #${{ github.run_number }}
          body: |
            Automated U-Boot build for Motorola Rhode / Qualcomm SM6225.
            - Branch: `sm6225`
            - Target: `boot-uboot-sm6225.img`
          files: |
            output/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}