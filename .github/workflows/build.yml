name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Kernel branch'
        required: true
        type: choice
        options:
          - Ayanami-rc2
          - Ayanami-rc2-kona-2
          - staging
        default: staging

permissions:
  contents: write

concurrency:
  group: ayanami-kernel-build
  cancel-in-progress: false

env:
  KERNEL_REPO: https://gitlab.com/MatrixhKa/android_kernel_motorola_sm6225
  ANYKERNEL_REPO: https://gitlab.com/MatrixhKa/AnyKernel3.git
  CLANG_URL: https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/30072026/neutron-clang-30072026.tar.zst

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPRESS: "true"
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: time_macros,include_file_mtime,include_file_ctime
      CCACHE_NOHASHDIR: "true"

    steps:
      - name: Resolve branch and zip name
        id: vars
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          case "$BRANCH" in
            Ayanami-rc2-kona-2) suffix="Kona-rhode" ;;
            Ayanami-rc2)        suffix="rhode" ;;
            *)                  suffix="staging-rhode" ;;
          esac
          echo "kernel_branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "zip_suffix=$suffix" >> "$GITHUB_OUTPUT"
          echo "zip_name=AnyKernel3-$suffix-${{ github.run_number }}.zip" >> "$GITHUB_OUTPUT"

      - name: Install required packages
        run: |
          sudo sed -i 's|http://archive.ubuntu.com/ubuntu|mirror://mirrors.ubuntu.com/mirrors.txt|g' /etc/apt/sources.list
          sudo apt-get update -y
          sudo apt-get install -y \
            build-essential bc flex bison libssl-dev libelf-dev libncurses5-dev \
            zstd dwarves cpio python-is-python3 device-tree-compiler curl zip ccache

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ayanami-ccache-${{ runner.os }}-${{ runner.arch }}-${{ steps.vars.outputs.kernel_branch }}-${{ github.run_id }}
          restore-keys: |
            ayanami-ccache-${{ runner.os }}-${{ runner.arch }}-${{ steps.vars.outputs.kernel_branch }}-
            ayanami-ccache-${{ runner.os }}-${{ runner.arch }}-

      - name: Checkout Kernel
        run: git clone -b "${{ steps.vars.outputs.kernel_branch }}" "$KERNEL_REPO" --depth=1 kernel

      - name: Setup Clang
        run: |
          mkdir -p ~/clang && cd ~/clang
          wget -q "$CLANG_URL" -O clang.tar.zst
          tar -xf clang.tar.zst
          rm -f clang.tar.zst
          echo "$HOME/clang/bin" >> "$GITHUB_PATH"

      - name: Setup KernelSU
        working-directory: kernel
        run: curl -LSs "https://github.com/Baka-SU/BakaSU/raw/refs/heads/main/kernel/setup.sh" | bash -s

      - name: Build Kernel
        working-directory: kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64

          export LLVM=1
          export LLVM_IAS=1
          export LD=ld.lld
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          export CCACHE_BASEDIR="$GITHUB_WORKSPACE/kernel"

          ccache -z
          mkdir -p out
          make -j"$(nproc --all)" O=out CC="ccache clang" vendor/ayanami_defconfig
          make -j"$(nproc --all)" O=out CC="ccache clang"
          ccache -s

      - name: AnyKernel3
        run: |
          mkdir -p output
          git clone --depth=1 "$ANYKERNEL_REPO" AnyKernel3
          cp kernel/out/arch/arm64/boot/Image.gz *.img AnyKernel3/
          cd AnyKernel3
          zip -r9 "../output/${{ steps.vars.outputs.zip_name }}" . \
            -x ".git/*" ".github/*" "README.md" "*.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kernel-${{ github.run_number }}
          name: Ayanami Kernel - Run ${{ github.run_number }}
          body: |
            Device: rhode
            Branch: ${{ steps.vars.outputs.kernel_branch }}
            Kernel: Ayanami
            Compiler: Neutron Clang
            Build #${{ github.run_number }}
          files: output/${{ steps.vars.outputs.zip_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Telegram
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s \
            -F chat_id="$TG_CHAT_ID" \
            -F document=@"output/${{ steps.vars.outputs.zip_name }}" \
            -F caption="Ayanami Kernel ${{ steps.vars.outputs.zip_suffix }} #${{ github.run_number }}" \
            "https://api.telegram.org/bot$TG_TOKEN/sendDocument"
