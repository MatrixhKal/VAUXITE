name: Build U-Boot Motorola Rhode (SM6225)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      DEFCONFIG: qcom_defconfig qcom-phone.config
      DEVICE_TREE: qcom/sm6225-motorola-rhode
      ARCH: arm
      CROSS_COMPILE: aarch64-linux-gnu-

    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libncurses-dev \
            swig \
            python3-dev \
            python3-setuptools \
            python3-pyelftools \
            device-tree-compiler \
            gcc-aarch64-linux-gnu \
            libgnutls28-dev \
            uuid-dev

      - name: Clone AOSP mkbootimg repository
        run: |
          git clone --depth 1 https://android.googlesource.com/platform/system/tools/mkbootimg $HOME/mkbootimg_tools

      - name: Clone U-Boot
        run: |
          git clone --depth 1 -b sm6225 https://gitlab.com/sm6225-schizophrenics/rhode-mainline/u-boot-motorola-rhode.git u-boot

      - name: Configure U-Boot
        run: |
          cd u-boot
          make ARCH=${{ env.ARCH }} CROSS_COMPILE=${{ env.CROSS_COMPILE }} ${{ env.DEFCONFIG }}

      - name: Build U-Boot
        run: |
          cd u-boot
          make ARCH=${{ env.ARCH }} CROSS_COMPILE=${{ env.CROSS_COMPILE }} DEVICE_TREE=${{ env.DEVICE_TREE }} -j$(nproc)
          test -f u-boot-dtb.bin

      - name: Pack U-Boot into Boot Image
        run: |
          cd u-boot

          UBOOT="u-boot-dtb.bin"
          DTB="arch/arm/dts/${{ env.DEVICE_TREE }}.dtb"
          INITFS_FILE="initramfs-empty.gz"

          test -f "${DTB}"

          gzip -c -9 ${UBOOT} > ${UBOOT}.gz

          echo 1 > 1
          gzip -c -9 1 > ${INITFS_FILE}
          rm -f 1

          mkdir -p ../output

          python3 $HOME/mkbootimg_tools/mkbootimg.py \
            --header_version 3 \
            --pagesize 4096 \
            --kernel ${UBOOT}.gz \
            --ramdisk ${INITFS_FILE} \
            --dtb ${DTB} \
            --os_version "15.0.0" \
            --os_patch_level "2025-10" \
            -o ../output/boot-uboot-sm6225.img

          cp u-boot-dtb.bin ../output/ || true
          cp ${DTB} ../output/ || true
          cp .config ../output/u-boot.config || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: u-boot-rhode-${{ github.run_number }}
          name: U-Boot Motorola Rhode - Build #${{ github.run_number }}
          body: |
            Automated U-Boot build for Motorola Rhode / Qualcomm SM6225.
            - Branch: `sm6225`
            - Target: `boot-uboot-sm6225.img`
          files: |
            output/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}