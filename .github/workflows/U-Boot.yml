name: Build U-Boot Motorola Rhode (SM6225)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y --no-install-recommends gcc-aarch64-linux-gnu libgnutls28-dev

      # mkbootimg in Ubuntu repos is broken, so use the forked C variant
      - name: Build mkbootimg
        run: |
          git clone https://github.com/osm0sis/mkbootimg
          cd mkbootimg
          CFLAGS=-Wstringop-overflow=0 make mkbootimg
          cd ..

      - name: Configure U-Boot
        run: |
          make CROSS_COMPILE=aarch64-linux-gnu- O=.output qcom_defconfig qcom-phone.config

      - name: Build U-Boot
        run: |
          make CROSS_COMPILE=aarch64-linux-gnu- O=.output -j$(nproc) CONFIG_DEFAULT_DEVICE_TREE=qcom/sm6225-motorola-rhode

      - name: Assemble Android boot.img
        run: |
          gzip .output/u-boot-nodtb.bin -c > .output/u-boot-nodtb.bin.gz
          cat .output/u-boot-nodtb.bin.gz .output/dts/upstream/src/arm64/qcom/sm6225-motorola-rhode.dtb > .output/uboot-dtb
          ./mkbootimg/mkbootimg --base '0x0' --kernel_offset '0x00008000' --pagesize '4096' --kernel .output/uboot-dtb -o .output/u-boot.img

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: u-boot-rhode-${{ github.run_number }}
          name: U-Boot Motorola Rhode - Build #${{ github.run_number }}
          body: |
            Automated U-Boot build for Motorola Rhode / Qualcomm SM6225.
            - Branch: `sm6225`
            - Target: `boot-uboot-sm6225.img`
          files: |
            .output/u-boot.img
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}