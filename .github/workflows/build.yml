name: Build Kernel
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Kernel branch'
        required: true
        type: choice
        options:
          - Ayanami-rc2
          - Ayanami-rc2-kona-2
          - staging
        default: staging
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve branch and zip name
        id: vars
        run: |
          if [ "${{ inputs.branch }}" = "Ayanami-rc2-kona-2" ]; then
            echo "kernel_branch=Ayanami-rc2-kona-2" >> "$GITHUB_OUTPUT"
            echo "zip_suffix=Kona-rhode" >> "$GITHUB_OUTPUT"
          else
            echo "kernel_branch=Ayanami-rc2" >> "$GITHUB_OUTPUT"
            echo "zip_suffix=rhode" >> "$GITHUB_OUTPUT"
          else
            echo "kernel_branch=staging" >> "$GITHUB_OUTPUT"
            echo "zip_suffix="staging-rhode" >> "$GITHUB_OUTPUT"
          fi

      - name: Install required packages
        run: |
          sudo sed -i 's|http://archive.ubuntu.com/ubuntu|mirror://mirrors.ubuntu.com/mirrors.txt|g' /etc/apt/sources.list
          sudo apt-get update -y
          sudo apt-get install -y \
                    build-essential bc flex bison libssl-dev libelf-dev libncurses5-dev \
                    zstd dwarves cpio python-is-python3 device-tree-compiler curl zip

      - name: Checkout Kernel
        run: |
          git clone -b ${{ steps.vars.outputs.kernel_branch }} https://github.com/MatrixhKa/android_kernel_motorola_sm6225 --depth=1 kernel

      - name: Setup Neutron Clang
        run: |
          mkdir -p ~/clang && cd ~/clang     
          wget https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/30072026/neutron-clang-30072026.tar.zst -O clang.tar.zst
          tar -xvf clang.tar.zst
          rm -f clang.tar.zst

      - name: Setup ReSukiSU
        working-directory: kernel
        run: |
          curl -LSs "https://github.com/ReSukiSU/ReSukiSU/raw/refs/heads/main/kernel/setup.sh" | bash -s

      - name: Generate defconfig
        working-directory: kernel
        run: |
          mkdir -p out

          sh scripts/kconfig/merge_config.sh -m -O out/ arch/arm64/configs/vendor/bengal-perf_defconfig arch/arm64/configs/vendor/ext_config/moto-bengal.config arch/arm64/configs/vendor/ext_config/rhode-default.config arch/arm64/configs/vendor/ayanami.config

      - name: Build Kernel
        working-directory: kernel
        run: |
          export PATH=~/clang/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export LLVM=1
          export LLVM_IAS=1
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export LD=ld.lld
          make -j$(nproc --all) O=out

      - name: Prepare AnyKernel3
        run: |
          mkdir -p output
          git clone --depth=1 https://github.com/MatrixhKa/AnyKernel3.git AnyKernel3
          cp kernel/out/arch/arm64/boot/Image.gz AnyKernel3/Image.gz
          cd AnyKernel3
          zip -r9 ../output/AnyKernel3-${{ steps.vars.outputs.zip_suffix }}-${{ github.run_number }}.zip . -x ".git/*" ".github/*" "README.md" "*.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kernel-${{ github.run_number }}
          name: Ayanami Kernel - Run ${{ github.run_number }}
          body: |
            Device: rhode
            Branch: ${{ steps.vars.outputs.kernel_branch }}
            Kernel: Ayanami
            Compiler: Neutron Clang
            Build #${{ github.run_number }}
          files: |
            output/AnyKernel3-${{ steps.vars.outputs.zip_suffix }}-${{ github.run_number }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Telegram
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s \
            -F chat_id="$TG_CHAT_ID" \
            -F document=@output/AnyKernel3-${{ steps.vars.outputs.zip_suffix }}-${{ github.run_number }}.zip \
            -F caption="Ayanami Kernel ${{ steps.vars.outputs.zip_suffix }} #${{ github.run_number }}" \
            "https://api.telegram.org/bot$TG_TOKEN/sendDocument"
